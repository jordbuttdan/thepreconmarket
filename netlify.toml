[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12
  NODE_VERSION = "22"

# Canonical host: apex (thepreconmarket.ca). Netlify serves HTTPS
# automatically and 301s HTTP -> HTTPS once the domain is provisioned.
[[redirects]]
  from = "https://www.thepreconmarket.ca/*"
  to = "https://thepreconmarket.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.thepreconmarket.ca/*"
  to = "https://thepreconmarket.ca/:splat"
  status = 301
  force = true

# Astro fingerprints everything under /_astro, so those files never change
# under the same name and can be cached for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
