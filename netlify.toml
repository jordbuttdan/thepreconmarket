[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12
  NODE_VERSION = "22"

# Canonical host: apex (thepreconmarket.ca). Netlify serves HTTPS
# automatically and 301s HTTP -> HTTPS once the domain is provisioned.
[[redirects]]
  from = "https://www.thepreconmarket.ca/*"
  to = "https://thepreconmarket.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.thepreconmarket.ca/*"
  to = "https://thepreconmarket.ca/:splat"
  status = 301
  force = true
